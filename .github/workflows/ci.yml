name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@546968aa9c3c08be94df6730f7e504fbfbe94450
    with:
      run-poll-tick: true

  readiness:
    name: Independent credential readiness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@72e20ecb528bf38aace65865565dfc811f07ceed
      - name: Check outbound and inbound credential controls
        run: python3 tests/readiness_matrix.py

  ci-status:
    name: CI status
    if: ${{ always() }}
    needs: [harn, readiness]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@546968aa9c3c08be94df6730f7e504fbfbe94450
        with:
          results-json: ${{ toJSON(needs.*.result) }}
