[package]
name = "harn-notion-connector"
version = "0.1.1"
description = "Notion connector for Harn webhooks, polling, artifact helpers, and outbound API dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-notion-connector"
harn = ">=0.10,<0.11"
docs_url = "README.md"
provenance = "https://github.com/burin-labs/harn-notion-connector/releases/tag/v0.1.1"

[exports]
default = "src/lib.harn"

[[providers]]
id = "notion"
connector = { harn = "src/lib.harn" }
capabilities = ["webhook", "oauth", "pagination"]

[providers.oauth]
resource = "https://api.notion.com/"
authorization_endpoint = "https://api.notion.com/v1/oauth/authorize"
token_endpoint = "https://api.notion.com/v1/oauth/token"
token_endpoint_auth_method = "client_secret_basic"

[providers.setup]
auth_type = "oauth2"
flow = "oauth2"
required_secrets = ["notion/api-token", "notion/verification-token"]
setup_command = ["harn", "connect", "notion"]
validation_command = ["harn", "connect", "status", "--connector", "notion", "--json"]

[[providers.setup.health_checks]]
id = "api-token"
kind = "secret"
secret = "notion/api-token"

[[providers.setup.health_checks]]
id = "verification-token"
kind = "secret"
secret = "notion/verification-token"

[providers.setup.recovery]
missing_auth = "Store notion/api-token and notion/verification-token before enabling Notion bindings."
expired_credentials = "Refresh the OAuth token or rotate the internal integration token, then rerun validation."
revoked_credentials = "Replace notion/api-token with an active Notion OAuth or internal integration token."
missing_scopes = "Grant page, database, block, comment, or user capabilities required by the configured workflows."
inaccessible_resource = "Share the target Notion pages or databases with the integration."
transient_provider_outage = "Retry after Notion API and webhook delivery endpoints are healthy."

# Publishable dependencies must be git-backed so this package resolves from a
# clean consumer project without a sibling checkout.
[dependencies]
notion-sdk-harn = { git = "https://github.com/burin-labs/notion-sdk-harn", rev = "v0.2.0" }

[connector_contract]
version = 1

# Security: after the 2026-05-23 F6 fix the Notion connector enforces a
# 300-second freshness window on payload.timestamp against the trusted
# clock so captured signed webhooks cannot be replayed indefinitely. The
# static signed-fixture bodies below therefore now demonstrate the
# replay-window rejection — happy-path normalize_inbound behaviour is
# exercised by the tests/*.harn pipelines, which rewrite each fixture's
# `timestamp` field to a fresh value at run time and sign over the
# refreshed bytes so the connector accepts them within the window.

[[connector_contract.fixtures]]
provider = "notion"
name = "page content updated rejects stale signature"
kind = "webhook"
body = '''{"id":"evt_page_1","timestamp":"2026-04-19T12:34:56Z","type":"page.content_updated","workspace_id":"ws_test","subscription_id":"sub_test","integration_id":"int_test","actor":{"id":"user_ada","name":"Ada Lovelace"},"entity":{"id":"page_alpha","type":"page","parent":{"id":"database_tasks","type":"database"}}}'''
headers = { "content-type" = "application/json", "x-notion-signature" = "sha256=cdfabcb5e43424d5d9e8696f5200643aad42bb8e8716e3ca08dd3e2e2bf19abc", "request-id" = "req_page_1" }
metadata = { verification_token = "contract-fixture-secret" }
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0

[[connector_contract.fixtures]]
provider = "notion"
name = "database created rejects stale signature"
kind = "webhook"
body = '''{"id":"evt_database_1","timestamp":"2026-04-19T12:35:56Z","type":"database.created","workspace_id":"ws_test","subscription_id":"sub_test","actor":{"id":"user_grace","name":"Grace Hopper"},"entity":{"id":"database_projects","type":"database","parent":{"id":"page_home","type":"page"}}}'''
headers = { "content-type" = "application/json", "x-notion-signature" = "sha256=e845e38241ba965f88590fe259cad15c49875b8ba787e82136eed9dfafd934f8", "request-id" = "req_database_1" }
metadata = { verification_token = "contract-fixture-secret" }
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0

[[connector_contract.fixtures]]
provider = "notion"
name = "comment created rejects stale signature"
kind = "webhook"
body = '''{"id":"evt_comment_1","timestamp":"2026-04-19T12:36:56Z","type":"comment.created","workspace_id":"ws_test","subscription_id":"sub_test","actor":{"id":"user_katherine","name":"Katherine Johnson"},"entity":{"id":"comment_delta","type":"comment","parent":{"id":"page_alpha","type":"page"}}}'''
headers = { "content-type" = "application/json", "x-notion-signature" = "sha256=93cdf3345ecbe853d0530bfcf5d774256362d178f83c8cf7a1751767148d4390", "request-id" = "req_comment_1" }
metadata = { verification_token = "contract-fixture-secret" }
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0

# F5: subscription.verification now emits under a dedicated kind so
# downstream code must handle the unsigned path explicitly.
[[connector_contract.fixtures]]
provider = "notion"
name = "subscription verification"
kind = "webhook"
headers = { "content-type" = "application/json" }
body = '''{"verification_token":"verify-token","type":"subscription.verification","id":"verification_1"}'''
expect_type = "event"
expect_kind = "notion.subscription.verification"
expect_signature_state = "unsigned"
# The connector owns this payload schema. Assertions describe the payload
# normalize_inbound returns, not a host envelope wrapped around it.
expect_payload_contains = { provider = "notion", event = "notion.subscription.verification", event_type = "notion.subscription.verification", verification_token = "verify-token", entity_id = "verification_1", resource_id = "verification_1" }
expect_event_count = 1

[[connector_contract.fixtures]]
provider = "notion"
name = "harn-cloud managed ingress rejects stale signature"
kind = "webhook"
body = '''{"id":"evt_page_1","timestamp":"2026-04-19T12:34:56Z","type":"page.content_updated","workspace_id":"ws_test","subscription_id":"sub_test","integration_id":"int_test","actor":{"id":"user_ada","name":"Ada Lovelace"},"entity":{"id":"page_alpha","type":"page","parent":{"id":"database_tasks","type":"database"}}}'''
headers = { "content-type" = "application/json", "x-notion-signature" = "sha256=cdfabcb5e43424d5d9e8696f5200643aad42bb8e8716e3ca08dd3e2e2bf19abc", "request-id" = "req_cloud_page_1" }
metadata = { tenant_slug = "acme", trigger_id = "notion", binding_id = "notion", provider = "notion", package = { name = "harn-notion-connector", version = "v0.1.1" }, signature_status = "verified", secret_ids = { verification_token = "notion.webhook.secret", signing_secret = "notion.webhook.secret" }, sandbox = { tenant_id = "tenant-acme", egress_allowlist = ["api.notion.com"] } }
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0
