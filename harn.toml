[package]
name = "harn-notion-connector"
version = "0.1.0"
description = "Notion connector for Harn webhooks, polling, and outbound API dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-notion-connector"
harn = ">=0.8,<0.9"
docs_url = "README.md"
provenance = "https://github.com/burin-labs/harn-notion-connector/releases/tag/v0.1.0"

[exports]
default = "src/lib.harn"

[[providers]]
id = "notion"
connector = { harn = "src/lib.harn" }
capabilities = ["webhook", "oauth", "pagination"]

[providers.oauth]
resource = "https://api.notion.com/"
authorization_endpoint = "https://api.notion.com/v1/oauth/authorize"
token_endpoint = "https://api.notion.com/v1/oauth/token"
token_endpoint_auth_method = "client_secret_basic"

[providers.setup]
auth_type = "oauth2"
flow = "oauth2"
required_secrets = ["notion/api-token", "notion/verification-token"]
setup_command = ["harn", "connect", "notion"]
validation_command = ["harn", "connect", "status", "--connector", "notion", "--json"]

[[providers.setup.health_checks]]
id = "api-token"
kind = "secret"
secret = "notion/api-token"

[[providers.setup.health_checks]]
id = "verification-token"
kind = "secret"
secret = "notion/verification-token"

[providers.setup.recovery]
missing_auth = "Store notion/api-token and notion/verification-token before enabling Notion bindings."
expired_credentials = "Refresh the OAuth token or rotate the internal integration token, then rerun validation."
revoked_credentials = "Replace notion/api-token with an active Notion OAuth or internal integration token."
missing_scopes = "Grant page, database, block, comment, or user capabilities required by the configured workflows."
inaccessible_resource = "Share the target Notion pages or databases with the integration."
transient_provider_outage = "Retry after Notion API and webhook delivery endpoints are healthy."

# Publishable dependencies must be git-backed so this package resolves from a
# clean consumer project without a sibling checkout.
[dependencies]
notion-sdk-harn = { git = "https://github.com/burin-labs/notion-sdk-harn", rev = "7c4ee367b8c60166d177b857b91798554f1ccce9" }

[connector_contract]
version = 1

[[connector_contract.fixtures]]
provider = "notion"
name = "page content updated webhook"
kind = "webhook"
body = '''{"id":"evt_page_1","timestamp":"2026-04-19T12:34:56Z","type":"page.content_updated","workspace_id":"ws_test","subscription_id":"sub_test","integration_id":"int_test","actor":{"id":"user_ada","name":"Ada Lovelace"},"entity":{"id":"page_alpha","type":"page","parent":{"id":"database_tasks","type":"database"}}}'''
headers = { "content-type" = "application/json", "x-notion-signature" = "sha256=cdfabcb5e43424d5d9e8696f5200643aad42bb8e8716e3ca08dd3e2e2bf19abc", "request-id" = "req_page_1" }
metadata = { verification_token = "contract-fixture-secret" }
expect_type = "event"
expect_kind = "page.content_updated"
expect_signature_state = "verified"
expect_payload_contains = { provider = "notion", event = "page.content_updated", workspace_id = "ws_test", request_id = "req_page_1", subscription_id = "sub_test", integration_id = "int_test", entity_id = "page_alpha", entity_type = "page", raw = { event_type = "page.content_updated", resource_id = "page_alpha", parent_id = "database_tasks" } }
expect_event_count = 1

